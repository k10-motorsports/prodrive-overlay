name: Build & Release

# Builds the Electron overlay (win-x64 + win-arm64 unpacked trees) and
# attaches them as release assets. Consumed by prodrive-windows' installer
# pipeline, which downloads the unpacked trees and bundles them into the
# combined installer.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-win:
    name: Build Overlay (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build overlay (win x64 + arm64)
        run: npx electron-builder --win --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack win-unpacked (x64) for downstream consumers
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/overlay-win-unpacked.zip

      - name: Pack win-arm64-unpacked for downstream consumers
        shell: pwsh
        run: Compress-Archive -Path dist/win-arm64-unpacked/* -DestinationPath dist/overlay-win-arm64-unpacked.zip

      # The Stream Deck plugin lives in the overlay's repo source tree
      # (streamdeck/racecor/com.k10motorsports.racecor.overlay.sdPlugin/)
      # but electron-builder buries it inside resources/app.asar with
      # the rest of the renderer. The host installer needs the plugin
      # as a real on-disk folder so it can copy it into Elgato's
      # plugins dir on ssPostInstall — pack it standalone here so the
      # host workflow can pull it directly without parsing the asar.
      - name: Pack Stream Deck plugin for downstream consumers
        shell: pwsh
        run: |
          $sdSrc = "streamdeck/racecor/com.k10motorsports.racecor.overlay.sdPlugin"
          if (-not (Test-Path "$sdSrc/manifest.json")) {
            throw "Stream Deck plugin manifest missing at $sdSrc/manifest.json"
          }
          # Wrap the .sdPlugin folder so the zip preserves the full
          # folder name when extracted (Stream Deck looks for the
          # exact com.k10motorsports.racecor.overlay.sdPlugin dir).
          New-Item -ItemType Directory -Force -Path dist/streamdeck-stage | Out-Null
          Copy-Item -Recurse -Force $sdSrc dist/streamdeck-stage/
          Compress-Archive -Path dist/streamdeck-stage/* -DestinationPath dist/streamdeck-plugin.zip
          Write-Host "Packed: $((Get-Item dist/streamdeck-plugin.zip).Length) bytes"

      - name: Upload win-unpacked (x64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-win-unpacked
          path: dist/win-unpacked/

      - name: Upload win-arm64-unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-win-arm64-unpacked
          path: dist/win-arm64-unpacked/

      - name: Publish release with packed artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/overlay-win-unpacked.zip
            dist/overlay-win-arm64-unpacked.zip
            dist/streamdeck-plugin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
